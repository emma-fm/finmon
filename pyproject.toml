[project]
name = "finmon"
version = "0.1.0"
description = "Personal finance monitor: bank sync (PSD2), LLM analysis, Telegram alerts"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "PyJWT[crypto]>=2.8"]

[project.optional-dependencies]
anthropic = ["anthropic>=2.8"]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["finmon*"]
